<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraPS Spin Pro - Pixel Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --gt-purple: #4a217d;
    --gt-dark: #1a0b2e;
    --gt-bright: #a855f7;
    --gt-border: #7c3aed;
    --gt-gold: #fbbf24;
  }

  body {
    margin: 0; font-family: 'Courier New', Courier, monospace;
    background: #0f051a url('https://www.transparenttextures.com/patterns/dark-matter.png');
    color: white; min-height: 100vh; overflow-x: hidden;
  }

  /* PANEL UTAMA */
  .spin-app {
    max-width: 1100px; margin: 40px auto;
    background: rgba(26, 11, 46, 0.9);
    border: 4px solid var(--gt-border);
    border-radius: 20px; padding: 30px;
    box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
  }

  .title-area { text-align: center; margin-bottom: 30px; }
  .title-area h1 { 
    font-size: 2.5rem; color: white; text-shadow: 4px 4px 0px var(--gt-purple);
    letter-spacing: 2px; margin: 0;
  }

  .main-layout { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

  /* SIDEBAR LEFT: LIST PESERTA */
  .side-panel {
    width: 280px; background: #2d1b4d; border: 3px solid var(--gt-purple);
    border-radius: 15px; padding: 20px;
  }
  .side-panel h3 { margin-top: 0; border-bottom: 2px solid var(--gt-border); padding-bottom: 10px; font-size: 1rem; }
  
  .input-box {
    width: 100%; padding: 10px; margin-bottom: 10px;
    background: #1a0b2e; border: 2px solid var(--gt-border);
    color: white; border-radius: 5px;
  }

  .btn-gt {
    width: 100%; padding: 10px; background: var(--gt-bright);
    border: none; border-bottom: 4px solid #7e22ce;
    color: white; font-weight: bold; cursor: pointer; border-radius: 5px;
  }

  .item-list { margin-top: 15px; max-height: 250px; overflow-y: auto; }
  .item-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.3); padding: 8px; margin-bottom: 5px; border-radius: 5px;
  }

  /* WHEEL AREA (CENTER) */
  .wheel-area { position: relative; text-align: center; }
  .canvas-wrapper { position: relative; width: 400px; height: 400px; margin: 0 auto; }
  #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #2d1b4d; }
  
  .pointer {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 20px solid transparent;
    border-right: 20px solid transparent; border-top: 35px solid #ff4444; z-index: 10;
  }

  /* REDEEM SYSTEM */
  .redeem-bar {
    background: #1a0b2e; padding: 15px; border-radius: 10px;
    margin: 20px auto; max-width: 400px; border: 2px dashed var(--gt-gold);
  }

  /* POPUP WINNER */
  .winner-modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
    background: var(--gt-dark); padding: 40px; border: 5px solid var(--gt-gold);
    border-radius: 20px; text-align: center; z-index: 1000; transition: 0.3s;
  }
  .winner-modal.active { transform: translate(-50%, -50%) scale(1); }

  /* ADMIN PANEL (HIDDEN) */
  .admin-zone { font-size: 0.6rem; opacity: 0.2; text-align: center; margin-top: 50px; }
</style>
</head>
<body>

<div class="spin-app">
    <div class="title-area">
        <h1>TeraPS <span style="color:var(--gt-bright)">SPIN</span></h1>
        <div class="redeem-bar">
            <input type="text" id="redeemIn" placeholder="ENTER REDEEM CODE" oninput="verify()" style="background:none; border:none; color:gold; text-align:center; font-weight:bold; width:100%; outline:none;">
        </div>
    </div>

    <div class="main-layout">
        <div class="side-panel">
            <h3><i class="fas fa-users"></i> List Peserta</h3>
            <input type="text" id="nameIn" class="input-box" placeholder="Nama Hadiah/Player">
            <button class="btn-gt" onclick="add()">TAMBAH</button>
            <div id="itemList" class="item-list"></div>
        </div>

        <div class="wheel-area">
            <div class="canvas-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
            </div>
            <button id="spinBtn" class="btn-gt" style="margin-top:25px; width:200px; font-size:1.5rem; background:#666;" onclick="play()" disabled>LOCKED</button>
        </div>

        <div class="side-panel" style="width:200px;">
            <h3><i class="fas fa-cog"></i> Pengaturan</h3>
            <label style="font-size:0.8rem;"><input type="checkbox" id="delWin"> Hapus Pemenang</label>
        </div>
    </div>
</div>

<div id="winModal" class="winner-modal">
    <h2 style="color:var(--gt-gold);">🎉 PEMENANG 🎉</h2>
    <h1 id="winName" style="font-size: 3rem; margin: 15px 0;"></h1>
    <button class="btn-gt" onclick="location.reload()">CLAIM HADIAH</button>
</div>

<div class="admin-zone">
    <input type="password" id="adP" placeholder="Admin Pass" style="width:50px;"> 
    <button onclick="gen()">Gen</button>
    <span id="newCode" style="color:lime; margin-left:10px;"></span>
</div>

<script>
    let participants = ["Red Hulk", "Chae-Won", "Nailong", "Stitch", "Blood Mage", "Shadow", "Gojo", "Mitsuki"];
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    let startAngle = 0;
    const MASTER_PW = "TERA100";
    let activeCode = "TERA-PRO";

    // Gambar Avatar (Dummy Link - Nanti otomatis pakai file kamu)
    const avatars = {
        "Red Hulk": "redhulk.jpg", "Chae-Won": "chaewon.jpg", "Nailong": "nailong.jpg",
        "Stitch": "stitch.jpg", "Blood Mage": "bloodmage.jpg", "Shadow": "shadow.jpg",
        "Gojo": "gojo.jpg", "Mitsuki": "mitsuki.jpg"
    };

    function draw() {
        ctx.clearRect(0,0,500,500);
        const arc = Math.PI / (participants.length / 2);
        participants.forEach((text, i) => {
            const angle = startAngle + i * arc;
            ctx.fillStyle = i % 2 === 0 ? "#4a217d" : "#1a0b2e";
            ctx.beginPath(); ctx.arc(250, 250, 230, angle, angle + arc, false); ctx.lineTo(250, 250); ctx.fill();
            ctx.strokeStyle = "#7c3aed"; ctx.lineWidth = 2; ctx.stroke();

            ctx.save();
            ctx.translate(250 + Math.cos(angle + arc/2) * 160, 250 + Math.sin(angle + arc/2) * 160);
            ctx.rotate(angle + arc/2 + Math.PI/2);
            
            // Text Hadiah
            ctx.fillStyle = "white";
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText(text, -ctx.measureText(text).width/2, 35);
            
            // Gambar Karakter (Jika ada)
            const img = new Image();
            img.src = avatars[text] || "1.jpg"; // Fallback ke file 1.jpg
            ctx.drawImage(img, -20, -40, 40, 40); 
            
            ctx.restore();
        });
    }

    function add() {
        const val = document.getElementById("nameIn").value;
        if(val) { participants.push(val); refreshList(); draw(); }
    }

    function refreshList() {
        const list = document.getElementById("itemList");
        list.innerHTML = participants.map((p, i) => `
            <div class="item-row">
                <span>${p}</span>
                <i class="fas fa-trash" style="color:red; cursor:pointer;" onclick="remove(${i})"></i>
            </div>
        `).join('');
    }

    function remove(i) { participants.splice(i, 1); refreshList(); draw(); }

    function verify() {
        const btn = document.getElementById("spinBtn");
        if(document.getElementById("redeemIn").value.toUpperCase() === activeCode) {
            btn.disabled = false; btn.style.background = "#a855f7"; btn.innerText = "SPIN NOW!";
        }
    }

    function gen() {
        if(document.getElementById("adP").value === MASTER_PW) {
            activeCode = "WIN-" + Math.floor(Math.random()*999);
            document.getElementById("newCode").innerText = activeCode;
        }
    }

    function play() {
        document.getElementById("spinBtn").disabled = true;
        let speed = Math.random() * 10 + 15;
        const totalSpin = 100 + Math.random() * 50;
        let count = 0;

        function animate() {
            startAngle += (speed * Math.PI / 180);
            speed *= 0.98; // Gesekan pelan-pelan
            draw();
            if(speed > 0.1) { requestAnimationFrame(animate); }
            else {
                const arc = Math.PI / (participants.length / 2);
                const degrees = startAngle * 180 / Math.PI + 90;
                const index = Math.floor((360 - degrees % 360) / (arc * 180 / Math.PI));
                document.getElementById("winName").innerText = participants[index];
                document.getElementById("winModal").classList.add("active");
                activeCode = "EXPIRED"; 
            }
        }
        animate();
    }

    refreshList();
    window.onload = draw;
</script>
</body>
</html>
